name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.4.0'
      - run: pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - run: pnpm typecheck
      - run: pnpm build:overlay
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-evidence
          path: test-results/
